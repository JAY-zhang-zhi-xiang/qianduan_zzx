<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>419张志翔</title>
    <style>
        p{
            color: red;
            font-size: 50px;
        }
        #box{
            width: 600px;
            height: 500px;
            background-color: #ccc;
        }
        .n1{
            color: blue;
        }
        .n2{
            color: green;
        }
        .n3{
            color: yellow;
            
        }
        h2{
            background-color: black;
            color: white;
            padding: 10px;
        }
        .selector-white{
            color: white;
        }
        #newbox{
            width: 600px;
            height: 500px;
            background-color: #ff0000;
        }
    </style>
</head>
<body>
    <h2>叠层样式表 CSS</h2>
    <div id="box">  
        <p> css<span class="selector-white">选择器</span></p>
        <p> <span class="n1">张</span><span class="n2">志</span><span class="n3">翔</span></p>
        <p> 属性</p>
    </div>
    <div id="newbox"></div>
</body>
</html>
