<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>上图下文卡片布局</title>
    <style>
        body {
            margin: 0;
            padding: 0; 
            background-color: #f5f5f5;
        }

        .ilist {
            list-style-type: none;
            padding: 0;
            margin: 0;
            display: flex; 
        }

        .ilist li {
            flex: 1; 
            margin: 0; 
            position: relative; 
            overflow: hidden; 
        }

        .ilist img {
            width: 100%; 
            height: auto;
            display: block; 
        }

        .ilist p {
            text-align: center;
            font-size: 14px;
            line-height: 33px;
            margin: 0;
            position: absolute;
            left: 0;
            bottom: 0;
            width: 100%;
            background-color: rgba(0, 0, 0, .5);
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>
<body>
    <ul class="ilist">
        <li>
            <img src="1.jpg" alt="Image 1">
            <p>张志翔的上文下图</p>
        </li>
        <li>
            <img src="2.jpg" alt="Image 2">
            <p>图片2</p>
        </li>
        <li>
            <img src="3.jpg" alt="Image 3">
            <p>图片3</p>
        </li>
    </ul>
</body>
</html>
