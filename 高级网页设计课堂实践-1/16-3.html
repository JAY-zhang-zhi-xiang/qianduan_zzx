        <button title="客服"><i class="iconfont icon-tongxunlu"></i></button>
        <button title="反馈"><i class="iconfont icon-dianzan"></i></button>
        <button title="收藏"><i class="iconfont icon-shoucang"></i></button>
        <button title="更多"><i class="iconfont icon-shenglvehao1"></i></button>
    </aside>

    <div class="zzx-toast" id="zzxToast"></div>

    <script>
        //========== 提示条：页面是仿写练习，下载/翻译只做交互反馈 ==========
        var zzxToast = document.getElementById("zzxToast");
        var zzxTimer = null;

        function zzxTip(zzxText) {
            zzxToast.textContent = zzxText;
            zzxToast.className = "zzx-toast zzx-toast-on";
            clearTimeout(zzxTimer);
            zzxTimer = setTimeout(function () {
                zzxToast.className = "zzx-toast";
            }, 1600);
        }

        //========== 标签页切换 ==========
        var zzxTabs = document.getElementById("zzxTabs").getElementsByTagName("button");

        for (var zzxI = 0; zzxI < zzxTabs.length; zzxI++) {
            zzxTabs[zzxI].onclick = function () {
                for (var zzxJ = 0; zzxJ < zzxTabs.length; zzxJ++) {
                    zzxTabs[zzxJ].className = "zzx-tab";
                }
                this.className = "zzx-tab zzx-tab-active";
                zzxTip("演示页面：这里只实现了「文本翻译」");
            };
        }

        //========== 语言交换 ==========
        var zzxFrom = document.getElementById("zzxLangFrom");
        var zzxTo = document.getElementById("zzxLangTo");
        var zzxSwap = document.getElementById("zzxSwap");

        zzxSwap.onclick = function () {
            var zzxTmp = zzxFrom.innerHTML;
            zzxFrom.innerHTML = zzxTo.innerHTML;
            zzxTo.innerHTML = zzxTmp;
        };

        //========== 翻译按钮：把输入内容按"译文占位"回显到右侧 ==========
        document.getElementById("zzxTranslate").onclick = function () {
            var zzxInput = document.getElementById("zzxInput").value.trim();
            var zzxOutput = document.getElementById("zzxOutput");

            if (!zzxInput) {
                zzxOutput.innerHTML = '<p style="color:#b9bec7">请输入文本后再点击翻译</p>';
                return;
            }
            zzxOutput.innerHTML = '<p style="color:#1f2329">' +
                "（演示页面，未接入翻译服务）<br>" +
                zzxInput.replace(/</g, "&lt;") +
                "</p>";
