<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>ink measure</title>
<link rel="stylesheet" href="mobile/css/iconfont.css">
<style>iframe{border:0;width:375px;height:812px}</style>
</head>
<body>
<iframe id="fa" src="mobile/index.html"></iframe>
<iframe id="fb" src="mobile/nav-fontclass.html"></iframe>
<pre id="out">pending</pre>
<script>
window.addEventListener('load', function () {
  var lines = [];
  var A = document.getElementById('fa').contentDocument;
  var B = document.getElementById('fb').contentDocument;

  lines.push('== SVG 版 (index.html) ==');
  var svgs = A.querySelectorAll('.zzx-tabbar__icon');
  for (var i = 0; i < svgs.length; i++) {
    var r = svgs[i].getBoundingClientRect();
    var bb = svgs[i].querySelector('use') ? null : null;
    lines.push('svg#' + i + ' box=' + r.width.toFixed(2) + 'x' + r.height.toFixed(2));
  }

  lines.push('== 字体版 (nav-fontclass.html) ==');
  var is = B.querySelectorAll('.zzx-tabbar__font');
  var cv = B.createElement('canvas');
  var ctx = cv.getContext('2d');
  for (var j = 0; j < is.length; j++) {
    var cs = B.defaultView.getComputedStyle(is[j]);
    var ch = cs.content.replace(/"/g, '');
    var fs = parseFloat(cs.fontSize);
    ctx.font = fs + 'px iconfont';
    var m = ctx.measureText(ch);
    var ink = m.actualBoundingBoxAscent + m.actualBoundingBoxDescent;
    lines.push('i#' + j + ' cls=' + is[j].className.replace(/zzx-tabbar__font/, '').trim() +
      ' font-size=' + fs + ' ink=' + ink.toFixed(2) +
      ' asc=' + m.actualBoundingBoxAscent.toFixed(2) + ' desc=' + m.actualBoundingBoxDescent.toFixed(2) +
      ' width=' + m.actualBoundingBoxLeft.toFixed(2) + '/' + m.actualBoundingBoxRight.toFixed(2));
  }
  document.getElementById('out').textContent = lines.join('\n');
});
</script>
</body></html>
