<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>overflow probe</title></head>
<body>
<iframe id="f" src="mobile/nav-fontclass.html" style="width:375px;height:812px;border:0"></iframe>
<pre id="out">pending</pre>
<script>
document.getElementById('f').addEventListener('load', function () {
  var w = this.contentWindow, d = this.contentDocument;
  var lines = [];
  lines.push('viewport innerWidth=' + w.innerWidth);
  lines.push('documentElement.scrollWidth=' + d.documentElement.scrollWidth);
  lines.push('body.scrollWidth=' + d.body.scrollWidth);
  var all = d.querySelectorAll('*');
  for (var i = 0; i < all.length; i++) {
    var el = all[i], r = el.getBoundingClientRect();
    if (r.right > w.innerWidth + 0.5 && r.width > 0) {
      var cls = el.className && el.className.baseVal !== undefined ? el.className.baseVal : el.className;
      lines.push('OVER ' + el.tagName + '.' + cls + ' right=' + r.right.toFixed(1) + ' w=' + r.width.toFixed(1) + ' x=' + r.left.toFixed(1));
    }
  }
  // 专门看导航条与页面容器
  ['.zzx-page', '.zzx-tabbar', '.zzx-tabbar__inner', '.zzx-header', '.zzx-score', '.zzx-feed'].forEach(function (s) {
    var e = d.querySelector(s);
    if (e) { var b = e.getBoundingClientRect(); lines.push('BOX ' + s + ' x=' + b.left.toFixed(1) + ' w=' + b.width.toFixed(1) + ' right=' + b.right.toFixed(1)); }
  });
  document.getElementById('out').textContent = lines.join('\n');
});
</script>
</body></html>
