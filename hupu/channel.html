                '<div class="channel-news-text">' +
                '<div class="channel-news-title">' + n.t + '</div>' +
                '<div class="channel-news-meta"><span><em>' + n.l + '亮</em> · ' + n.r + '回复</span><span>虎扑' + d.name + '资讯</span></div>' +
                '</div>' +
                '<div class="channel-news-thumb"><img src="assets/' + n.img + '" alt=""></div>' +
                '</div>';
        });

        // ---- 热帖榜 ----
        var hL = document.getElementById('hotList');
        d.hot.forEach(function (t, i) {
            var color = i === 0 ? '#C01E2E' : i === 1 ? '#FC7F00' : i === 2 ? '#FBB21A' : '#9C9FA4';
            hL.innerHTML += '<a class="channel-hot-item" href="post.html"><div class="channel-hot-index" style="color:' + color + '">' + (i + 1) + '</div>' +
                '<div class="channel-hot-title">' + t + '</div></a>';
        });

        // ---- 球队排行 ----
        var tL = document.getElementById('teamList');
        d.teams.forEach(function (t, i) {
            tL.innerHTML += '<div class="team-rank-item">' +
                '<img class="team-rank-logo" src="assets/nbalogo' + (i % 10) + '.png" alt="">' +
                '<span class="team-rank-name">' + t[0] + '</span>' +
                '<span class="team-rank-win">' + t[1] + '</span></div>';
        });
    </script>
</body>

</html>
