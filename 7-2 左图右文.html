<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>左图右文</title>
    <style>
        .box {
            width: 400px;
            margin: 20px 0;
        }

        .item {
            display: flex;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }

        .item img {
            width: 120px;
            height: auto;
            margin-right: 15px;
            border-radius: 4px;
        }

        .text h3 {
            margin: 0 0 5px 0;
            font-size: 18px;
            color: #333;
        }

        .text p {
            margin: 0;
            font-size: 14px;
            color: #888;
        }
    </style>
</head>
<body>

    <div class="box">
        <div class="item">
            <img src="1.jpg" alt="图片">
            <div class="text">
                <h3>标题</h3>
                <p>张志翔</p>
            </div>
        </div>

        <div class="item">
            <img src="2.jpg" alt="图片">
            <div class="text">
                <h3>标题</h3>
                <p>张志翔</p>
            </div>
        </div>

        <div class="item">
            <img src="3.jpg" alt="图片">
            <div class="text">
                <h3>标题</h3>
                <p>张志翔</p>
            </div>
        </div>
    </div>

</body>
</html>
