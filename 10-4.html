<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>八盒子布局 + 盒子内文字张志翔</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      /* 页面最小宽度 320px */
      min-width: 320px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f7fa;
    }

    .container {
      display: grid;
      /* 默认：320px 起，一行 2 个 */
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      padding: 10px;
    }

    .box {
      min-height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      background: #2f80ed;
      color: #fff;
      font-size: 18px;
      font-weight: 700;
      text-align: center;
      padding: 8px;
      /* 中文自动换行 */
      word-break: break-all;
    }

    /* 第 1 个 media：≥480px，一行 3 个 */
    @media (min-width: 480px) {
      .container {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
      .box {
        font-size: 20px;
      }
    }

    /* 第 2 个 media：≥768px，一行 4 个 */
    @media (min-width: 768px) {
      .container {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
      .box {
        font-size: 22px;
      }
    }

    /* 第 3 个 media：≥1200px，一行 8 个 */
    @media (min-width: 1200px) {
      .container {
        grid-template-columns: repeat(8, minmax(0, 1fr));
      }
      .box {
        font-size: 18px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="box">张志翔</div>
    <div class="box">张志翔</div>
    <div class="box">张志翔</div>
    <div class="box">张志翔</div>
    <div class="box">张志翔</div>
    <div class="box">张志翔</div>
    <div class="box">张志翔</div>
    <div class="box">张志翔</div>
  </div>
</body>
</html>
