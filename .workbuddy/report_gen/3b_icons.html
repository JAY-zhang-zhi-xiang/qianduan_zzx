<p style="font-family:'黑体';font-size:13.5pt;line-height:1.6;text-indent:0;margin:12pt 0 8pt 0;font-weight:bold">（2）图标获取</p><p style="font-family:'宋体';font-size:12pt;line-height:1.75;text-indent:2em;margin:0 0 6pt 0;text-align:justify">全部图标均来自 iconfont.cn。在本人自建的图标项目“zhangzhixiang2026”（项目 id 5244713）中共收集了 34 个字形，覆盖本导航所需的全部语义，最终选用 5 个（表 1）。字体包以 woff2 / woff / ttf 三种格式导出，同时得到 iconfont.css。其中“加号”虽然存在于字体包中，但三个加号字形本身都自带一圈圆形外框，放进红色圆钮里会出现“圈套圈”的双环效果，因此发布按钮的加号改用 CSS 绘制（见 2.2 代码 2）。</p>
