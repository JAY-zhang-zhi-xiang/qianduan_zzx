<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h2, h3, p {
            padding: 0;
            margin: 0;
        }
        #box {
            width: 480px;
            padding: 8px;
            border: 1px solid purple; 
            front-size: 12px;
            margin: 20px;
        }
        #box h3 {
            front-size: 15px;
            text-align: center;
            line-height: 33px;
            letter-spacing: 3px;
            color: #036;
        }
        #box p {
            line-height: 150%;
            color: #666;
            text-indent: 2em;
        }
        #box a {
            color: #036;
            text-decoration: none;
        }
        .xuehao {
            color: blue;
            font-weight: bold;
        }
        .yname {
            color: #036;
            font-weight: bold;
        }
        .nandu {
            color: red;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h2>CSS进阶</h2>
    <div id="box">  
       <h3>CSS那些事</h3>
       <p>
        学号：<span class="xuehao">419</span>，姓名：<span class="yname">张志翔</span>，班级：计算机24006 对于《高级网页设计》课程的难度认知为：<span class="nandu">难</span>，
        这个例子对应的知识点是：群组选择器，后代选择器，层叠与继承。
        <a href="#">更多>></a>
       </p>
    </div>
</body>
</html>
